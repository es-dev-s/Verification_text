<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text Extractor</title>
  <style>
    :root {
      --bg: #eef2f6;
      --card: #ffffff;
      --ink: #1a2332;
      --muted: #6b7a8d;
      --line: #d5dde8;
      --accent: #2c5f8a;
      --soft: #e8f0f7;
      --warn: #b45309;
      --warn-bg: #fff7ed;
      --error: #b91c1c;
      --error-bg: #fef2f2;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 520px at 8% -12%, #d7e4f0 0%, transparent 55%),
        radial-gradient(800px 420px at 100% 0%, #e2ebe3 0%, transparent 50%),
        var(--bg);
      padding: 36px 18px 64px;
    }
    main { max-width: 920px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 1.55rem; letter-spacing: -0.02em; }
    .lede { color: var(--muted); margin: 0 0 22px; max-width: 40rem; line-height: 1.45; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 1rem; }
    form.upload {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 9px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--error-bg);
      color: var(--error);
    }
    .hidden { display: none !important; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .chip {
      background: var(--soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
    }
    .chip.warn { background: var(--warn-bg); color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 560; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 420px;
      overflow: auto;
      background: #111827;
      color: #e5eef8;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.8rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>Text Extractor</h1>
    <p class="lede">
      Debug tool for native / OCR text extraction (PDF, PNG, JPG, DOCX).
      Structured form fill (Gemini) runs in the Verification Engine API, not here.
    </p>

    <section class="panel">
      <form id="upload-form" class="upload">
        <input
          type="file"
          name="file"
          accept=".pdf,.png,.jpg,.jpeg,.docx,application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          required
        />
        <button type="submit">Extract text</button>
      </form>
      <div id="error" class="error"></div>
    </section>

    <div id="results" class="hidden">
      <div class="meta" id="meta"></div>

      <section class="panel">
        <h2>Page sources</h2>
        <table>
          <thead>
            <tr>
              <th>Page</th>
              <th>Source</th>
              <th>OCR confidence</th>
              <th>Chars</th>
            </tr>
          </thead>
          <tbody id="pages"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Raw extracted text</h2>
        <pre id="raw-text"></pre>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("upload-form");
    const errorBox = document.getElementById("error");
    const results = document.getElementById("results");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      results.classList.add("hidden");
      button.disabled = true;
      button.textContent = "Extracting…";
      try {
        const response = await fetch("/extract-text", {
          method: "POST",
          body: new FormData(form),
        });
        const data = await response.json();
        if (!response.ok || data.error || data.ok === false) {
          throw new Error(data.error || "Extraction failed");
        }
        render(data);
      } catch (err) {
        errorBox.style.display = "block";
        const msg = err && err.message ? String(err.message) : String(err);
        // Browser shows this when the HTTP connection drops before OCR finishes.
        if (/failed to fetch|networkerror|load failed/i.test(msg)) {
          errorBox.textContent =
            "Failed to fetch — browser lost the connection before OCR finished. " +
            "PaddleOCR can take several minutes on CPU. Check the titlextractor " +
            "terminal for [ocr] / [extract-text] logs (OCR may still have succeeded).";
        } else {
          errorBox.textContent = msg;
        }
      } finally {
        button.disabled = false;
        button.textContent = "Extract text";
      }
    });

    function render(data) {
      const chips = [
        chip(data.filename || "file"),
        chip(data.method || "unknown"),
        data.page_count != null ? chip(`${data.page_count} pages`) : null,
        data.ocr_confidence != null
          ? chip(`OCR avg ${Number(data.ocr_confidence).toFixed(1)}`)
          : null,
        data.ok ? chip("ok") : chip("empty / failed", true),
      ].filter(Boolean);
      (data.warnings || []).slice(0, 5).forEach((w) => chips.push(chip(w, true)));
      document.getElementById("meta").innerHTML = chips.join("");

      const pages = data.pages || [];
      document.getElementById("pages").innerHTML = pages.length
        ? pages.map((p) => `
            <tr>
              <td>${p.page ?? "—"}</td>
              <td>${escapeHtml(p.source || p.method || "")}</td>
              <td>${p.ocr_confidence != null ? Number(p.ocr_confidence).toFixed(1) : "—"}</td>
              <td>${p.char_count ?? (p.text ? String(p.text).length : 0)}</td>
            </tr>`).join("")
        : `<tr><td colspan="4">No page breakdown (image/DOCX may be single-pass)</td></tr>`;

      document.getElementById("raw-text").textContent = data.raw_text || "(empty)";
      results.classList.remove("hidden");
    }

    function chip(label, warn = false) {
      return `<span class="chip${warn ? " warn" : ""}">${escapeHtml(label)}</span>`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
  </script>
</body>
</html>
